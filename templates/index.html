<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>أداة بحث Pexels</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #search-container { max-width: 800px; margin: auto; }
        #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
        .media-item { border: 1px solid #ccc; border-radius: 5px; overflow: hidden; }
        img, video { width: 100%; height: 180px; object-fit: cover; }
        .message { text-align: center; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="search-container">
        <h2>بحث في Pexels</h2>
        <select id="mediaType">
            <option value="photos">صور</option>
            <option value="videos">فيديوهات</option>
        </select>
        <input id="searchInput" placeholder="ابحث هنا..." />
        <button id="searchBtn">بحث</button>

        <div id="results"></div>
        <div class="message" id="message"></div>
        <button id="loadMore" style="display:none;">تحميل المزيد</button>
    </div>

    <script>
        const searchBtn = document.getElementById("searchBtn");
        const loadMoreBtn = document.getElementById("loadMore");
        const resultsDiv = document.getElementById("results");
        const messageDiv = document.getElementById("message");

        let currentQuery = "";
        let currentType = "photos";
        let currentPage = 1;

        searchBtn.addEventListener("click", () => {
            currentQuery = document.getElementById("searchInput").value.trim();
            currentType = document.getElementById("mediaType").value;
            currentPage = 1;
            resultsDiv.innerHTML = "";
            messageDiv.innerText = "";
            loadMoreBtn.style.display = "none";
            if (currentQuery) {
                fetchResults();
            } else {
                messageDiv.innerText = "الرجاء إدخال كلمة بحث.";
            }
        });

        loadMoreBtn.addEventListener("click", () => {
            currentPage++;
            fetchResults();
        });

        async function fetchResults() {
            try {
                const res = await fetch("/search", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        query: currentQuery,
                        mediaType: currentType,
                        page: currentPage
                    })
                });

                const data = await res.json();

                if (data.success) {
                    if (data.results.length === 0 && currentPage === 1) {
                        messageDiv.innerText = "لا توجد نتائج.";
                    } else {
                        displayResults(data.results);
                        loadMoreBtn.style.display = data.has_more ? "block" : "none";
                    }
                } else {
                    messageDiv.innerText = "خطأ: " + data.error;
                }
            } catch (err) {
                messageDiv.innerText = "حدث خطأ في الاتصال بالخادم.";
            }
        }

        function displayResults(items) {
            items.forEach(item => {
                const div = document.createElement("div");
                div.className = "media-item";
                if (item.type === "photo") {
                    div.innerHTML = `
                        <a href="${item.original}" target="_blank">
                            <img src="${item.src}" alt="${item.alt}" />
                        </a>`;
                } else if (item.type === "video") {
                    div.innerHTML = `
                        <video controls>
                            <source src="${item.src}" type="video/mp4" />
                        </video>`;
                }
                resultsDiv.appendChild(div);
            });
        }
    </script>
</body>
</html>
